# Android APK: builds with the Qt 6.11.1 android_arm64_v8a kit on every manual run and for version tags,
# and attaches the signed APK to the GitHub Release of the tag. A release keystore comes from the
# ANDROID_KEYSTORE_* secrets; without them the APK is signed with a throwaway debug key (side-loadable).
name: Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  QT_VERSION: 6.11.1
  QT_MODULES: 'qtmultimedia qtquick3d qtquick3dphysics qtquicktimeline qtshadertools qt5compat qtimageformats'
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    name: android (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 platform-tools' }
      - name: Install Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          dir: ${{ runner.temp }}/qt-host
      - name: Install Qt (android)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_MODULES }}
          cache: true
          dir: ${{ runner.temp }}/qt-android
      - name: OpenSSL for Android (KDAB bundle) and tools
        run: |
          git clone --depth 1 https://github.com/KDAB/android_openssl.git "$RUNNER_TEMP/android_openssl"
          sudo apt-get update && sudo apt-get install -y ninja-build && python3 -m pip install --user pillow
      - name: Release keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          { echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore";
            echo "ANDROID_KEYSTORE_ALIAS=${{ secrets.ANDROID_KEYSTORE_ALIAS }}";
            echo "ANDROID_KEYSTORE_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}";
            echo "ANDROID_KEYSTORE_KEY_PASS=${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}"; } >> "$GITHUB_ENV"
      - name: Build APK
        env:
          QT_HOST_ROOT: ${{ runner.temp }}/qt-host/Qt/${{ env.QT_VERSION }}/gcc_64
          QT_ANDROID_ROOT: ${{ runner.temp }}/qt-android/Qt/${{ env.QT_VERSION }}/android_arm64_v8a
          ANDROID_OPENSSL_INCLUDE: ${{ runner.temp }}/android_openssl/ssl_3/include
          ANDROID_OPENSSL_LIBDIR: ${{ runner.temp }}/android_openssl/ssl_3/arm64-v8a
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          sed -i 's/sysctl -n hw.ncpu 2>\/dev\/null || nproc/nproc/' scripts/build-android.sh
          scripts/build-android.sh
          ls -la build-android/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: escola-aventura-android
          path: build-android/*.apk
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-android/*.apk
          generate_release_notes: true
